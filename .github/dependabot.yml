# Third-party actions are pinned to commit SHAs (a tag is mutable, a SHA is
# not). The price is that updates no longer arrive on their own — that is
# Dependabot's job: it knows how to bump a pinned SHA and keep the version
# comment next to it current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
